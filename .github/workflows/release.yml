name: Build & Release Fortress Vault APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Signing Keystore (If Configured)
        if: ${{ secrets.SIGNING_KEY_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p output
          VERSION_TAG=${GITHUB_REF_NAME:-v1.2.0}
          cp app/build/outputs/apk/release/app-release.apk output/FortressVault-${VERSION_TAG}.apk || cp app/build/outputs/apk/release/*.apk output/FortressVault-${VERSION_TAG}.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortressVault-Release-APK
          path: output/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.apk
          name: Fortress Vault Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 🏰 Fortress Vault - Free Open-Source Release

            ### 📦 Download & Installation
            1. Download the `FortressVault-*.apk` file attached to this release.
            2. Follow our beginner-friendly **[Installation & WebADB Guide](USER_GUIDE.md)** to install and activate Fortress Vault on your device without downloading developer tools!

            ### ✨ Key Features
            - **App Blocker & Vault**: Hide and suspend distracting applications.
            - **Tamper Protection**: Device Owner policy enforcement prevents bypassing.
            - **No PC Tools Required**: Uses [WebADB.com](https://webadb.com) directly from your web browser!
            - **100% Free & Open-Source**: Privacy-focused with local network time checks.
